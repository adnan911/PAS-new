    <meta charset="UTF-8" />

    <title>Progressive Association Society - Fund Collection Portal</title>
    <meta name="description" content="Fund collection, installment tracking, and member payment dashboard for Progressive Association Society with bank deposit reconciliation and money receipts." />
    <meta property="og:title" content="Progressive Association Society - Fund Collection Portal" />
    <meta property="og:description" content="Fund collection, installment tracking, and member payment dashboard for Progressive Association Society with bank deposit reconciliation and money receipts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        // Prevent third-party browser extensions (like MetaMask inpage.js) from crashing the app
        function isExtensionError(msg, src, stack) {
          var str = ((msg || '') + ' ' + (src || '') + ' ' + (stack || '')).toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('ethereum') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('inpage.js') !== -1
          );
        }

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.message, event.filename, event.error && event.error.stack)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
          var stack = reason && reason.stack;
          if (isExtensionError(msg, '', stack)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
